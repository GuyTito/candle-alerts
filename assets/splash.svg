<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgSplash" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <linearGradient id="candleBodySplash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2FBF9F"/>
      <stop offset="100%" stop-color="#1E8E77"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgSplash)"/>

  <!-- Centered mark group, shifted slightly above center -->
  <g transform="translate(540, 820)">
    <!-- Upper wick -->
    <rect x="-15" y="-190" width="30" height="150" rx="15" fill="#7FE0C9"/>
    <!-- Lower wick -->
    <rect x="-15" y="240" width="30" height="150" rx="15" fill="#7FE0C9"/>
    <!-- Candle body -->
    <rect x="-120" y="-40" width="240" height="280" rx="28" fill="url(#candleBodySplash)"/>
    <!-- Alert clock -->
    <circle cx="120" cy="-30" r="118" fill="#0D1117"/>
    <circle cx="120" cy="-30" r="100" fill="#F5A623"/>
    <rect x="114" y="-94" width="14" height="72" rx="7" fill="#0D1117"/>
    <rect x="120" y="-36" width="58" height="14" rx="7" fill="#0D1117"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="1180" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle" letter-spacing="1"><tspan fill="#E6E9EC">Candle</tspan><tspan fill="#F5A623">Alerts</tspan></text>

  <!-- Tagline -->
  <text x="540" y="1240" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#7B8794" text-anchor="middle">Never miss a candle close</text>
</svg>
