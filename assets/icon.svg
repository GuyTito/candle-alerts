<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <linearGradient id="candleBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2FBF9F"/>
      <stop offset="100%" stop-color="#1E8E77"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Upper wick -->
  <rect x="497" y="220" width="30" height="150" rx="15" fill="#7FE0C9"/>

  <!-- Lower wick -->
  <rect x="497" y="650" width="30" height="150" rx="15" fill="#7FE0C9"/>

  <!-- Candle body -->
  <rect x="392" y="370" width="240" height="280" rx="28" fill="url(#candleBody)"/>

  <!-- Alert notch: amber clock face sitting into the top-right of the body,
       fusing "candle" + "alert/time" into one mark -->
  <circle cx="632" cy="380" r="118" fill="#0D1117"/>
  <circle cx="632" cy="380" r="100" fill="#F5A623"/>

  <!-- Clock hands -->
  <rect x="626" y="316" width="14" height="72" rx="7" fill="#0D1117"/>
  <rect x="632" y="374" width="58" height="14" rx="7" fill="#0D1117"/>

  <!-- Small tick marks around clock face -->
  <circle cx="632" cy="380" r="100" fill="none" stroke="#0D1117" stroke-width="4" stroke-dasharray="2 26" opacity="0.35"/>
</svg>
